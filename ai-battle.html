<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santorini AI Battle Arena</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .controls {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        select, input, button {
            padding: 8px;
            font-size: 14px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 10px 20px;
            margin-right: 10px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .results {
            background: white;
            border-radius: 8px;
            padding: 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #e3f2fd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-card.player1 {
            background: #e8f5e9;
        }
        .stat-card.player2 {
            background: #fff3e0;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        .progress {
            margin: 20px 0;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .game-log {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            background: #fafafa;
            font-family: monospace;
            font-size: 0.9em;
        }
        .log-entry {
            padding: 5px;
            margin: 2px 0;
            border-radius: 3px;
        }
        .log-entry.win {
            background: #c8e6c9;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Santorini AI Battle Arena</h1>

    <div class="controls">
        <div class="control-group">
            <label>Player 1 AI:</label>
            <select id="ai1-difficulty">
                <option value="easy">Easy (Random)</option>
                <option value="medium">Medium (Greedy)</option>
                <option value="hard">Hard (Minimax)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Player 2 AI:</label>
            <select id="ai2-difficulty">
                <option value="easy">Easy (Random)</option>
                <option value="medium" selected>Medium (Greedy)</option>
                <option value="hard">Hard (Minimax)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Number of Games:</label>
            <input type="number" id="num-games" value="100" min="1" max="1000">
        </div>
        <div class="control-group">
            <button id="start-btn">Start Battle</button>
            <button id="stop-btn" disabled>Stop</button>
        </div>
    </div>

    <div class="results">
        <div class="stats">
            <div class="stat-card player1">
                <div class="stat-value" id="player1-wins">0</div>
                <div class="stat-label">Player 1 Wins</div>
            </div>
            <div class="stat-card player2">
                <div class="stat-value" id="player2-wins">0</div>
                <div class="stat-label">Player 2 Wins</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-games">0</div>
                <div class="stat-label">Games Completed</div>
            </div>
        </div>

        <div class="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%">0%</div>
            </div>
        </div>

        <h3>Game Log</h3>
        <div class="game-log" id="game-log"></div>
    </div>

    <script src="game.js"></script>
    <script src="ai.js"></script>
    <script src="ai-battle.js"></script>
</body>
</html>
